<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Consultation de devis - My Prospect</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f1f5f9;color:#0f172a;font:15px Arial,sans-serif}.top{padding:28px max(22px,calc((100% - 920px)/2));background:#0f172a;color:#fff}.brand{font-weight:800;font-size:22px}.top p{margin:7px 0 0;color:#bfdbfe}.page{max-width:920px;margin:34px auto;padding:0 20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 16px 45px rgba(15,23,42,.08);overflow:hidden}.head{display:flex;justify-content:space-between;gap:20px;padding:28px;border-bottom:1px solid #e2e8f0}.head h1{margin:7px 0;font-size:27px}.eyebrow{color:#2563eb;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.status{align-self:center;padding:9px 13px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:800}.client{padding:22px 28px;background:#f8fafc;color:#475569}.client strong{display:block;color:#0f172a;font-size:16px;margin-top:5px}table{width:100%;border-collapse:collapse}th{padding:13px 28px;background:#eff6ff;color:#1e3a8a;text-align:left;font-size:11px}td{padding:17px 28px;border-bottom:1px solid #e2e8f0}th:not(:first-child),td:not(:first-child){text-align:right}.totals{display:flex;justify-content:flex-end;padding:24px 28px}.total{min-width:250px;padding:17px 19px;border-radius:12px;background:#f8fafc}.total div{display:flex;justify-content:space-between;margin:7px 0;color:#64748b}.total strong{color:#2563eb;font-size:20px}.action{padding:0 28px 28px;text-align:right}.button{border:0;border-radius:10px;padding:14px 19px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.secondary{margin-right:10px;background:#fff;color:#475569;border:1px solid #cbd5e1}.button:disabled{background:#94a3b8;cursor:default}.message{padding:50px 25px;text-align:center;color:#475569}.message h1{color:#0f172a}.note{padding:0 28px 28px;color:#64748b;font-size:12px}@media(max-width:620px){.head{padding:22px;display:block}.status{display:inline-block;margin-top:12px}th,td{padding:12px 9px;font-size:12px}.page{margin:18px auto;padding:0 10px}.client{padding:18px}.totals,.action{padding:18px}.total{min-width:100%}}
  </style>
</head>
<body>
  <header class="top"><div class="brand" id="brand">My Prospect</div><p>Consultation sécurisée de votre devis</p></header>
  <main class="page"><section class="card" id="app"><div class="message">Chargement du devis…</div></section></main>
  <script src="/js/pages/quote-client.js"></script>
</body></html>
