<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/admin-dashboard.css">
</head>
<body class="admin-dashboard-page">
  <main class="admin-dashboard-layout">
    <header class="admin-dashboard-header">
      <div>
        <h1 class="admin-dashboard-title">👑 Admin Dashboard</h1>
        <p class="admin-dashboard-subtitle">Gestion plateforme My Prospect</p>
      </div>

      <button class="admin-logout-button" onclick="logoutAdmin()">Déconnexion</button>
    </header>

    <div id="adminStats" class="admin-stats">
      <div class="admin-stat-card">
        <div class="admin-stat-label">Utilisateurs</div>
        <div id="totalUsers" class="admin-stat-value">...</div>
      </div>
    </div>

    <section class="admin-panel">
      <h2 class="admin-panel-title">Utilisateurs inscrits</h2>

      <div class="admin-filter-bar">
        <input id="adminUserSearch" class="admin-filter-control admin-filter-search" type="search" placeholder="Rechercher une adresse e-mail" oninput="filterAdminUsers()">
        <select id="adminVerificationFilter" class="admin-filter-control" onchange="filterAdminUsers()">
          <option value="all">Tous les comptes</option>
          <option value="verified">Comptes vérifiés</option>
          <option value="pending">À vérifier</option>
          <option value="suspended">Comptes suspendus</option>
        </select>
        <select id="adminSubscriptionFilter" class="admin-filter-control" onchange="filterAdminUsers()">
          <option value="all">Tous les abonnements</option>
          <option value="trial">Essais</option>
          <option value="active">Actifs</option>
          <option value="suspended">Suspendus</option>
          <option value="cancelled">Résiliés</option>
        </select>
        <button class="admin-export-button" type="button" onclick="exportAdminUsersCsv()">Exporter CSV</button>
      </div>

      <div id="adminUsers">Chargement...</div>

      <h2 class="admin-audit-title">Journal administrateur</h2>
      <div id="adminAudit" class="admin-audit">Chargement…</div>
    </section>
  </main>

  <script src="/js/admin.js"></script>
  <script src="/js/admin/api.js"></script>
  <script src="/js/admin/shared.js"></script>
  <script src="/js/admin/users.js"></script>
  <script src="/js/admin/actions.js"></script>
  <script src="/js/admin/summary.js"></script>
  <script src="/js/admin/billing-modal.js"></script>
  <script src="/js/admin/billing-presentation.js"></script>
  <script src="/js/admin/billing.js"></script>
  <script src="/js/admin/bootstrap.js"></script>
</body>
</html>
