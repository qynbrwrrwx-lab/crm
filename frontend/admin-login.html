<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin My-Prospect</title>
  <link rel="stylesheet" href="/styles/admin-login.css">
</head>
<body class="admin-login-page">
  <main class="admin-login-layout">
    <section class="admin-login-card">
      <img class="admin-login-logo" src="/logo.png" alt="My Prospect">

      <p class="admin-login-intro">Accès réservé administrateur</p>

      <form id="adminLoginForm" class="admin-login-form">
        <label class="admin-login-visually-hidden" for="adminEmail">Adresse e-mail administrateur</label>
        <input id="adminEmail" class="admin-login-input" type="email" placeholder="Email admin" autocomplete="username" required aria-describedby="adminLoginStatus">

        <label class="admin-login-visually-hidden" for="adminPassword">Mot de passe</label>
        <input id="adminPassword" class="admin-login-input" type="password" placeholder="Mot de passe" autocomplete="current-password" required aria-describedby="adminLoginStatus">

        <button id="adminLoginSubmit" class="admin-login-submit" type="submit">Se connecter</button>
        <p id="adminLoginStatus" class="admin-login-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="/js/pages/admin-login.js"></script>
</body>
</html>
