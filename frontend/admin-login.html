<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin My-Prospect</title>
  <link rel="stylesheet" href="/styles/admin-login.css">
</head>
<body class="admin-login-page">
  <main class="admin-login-layout">
    <section class="admin-login-card">
      <img class="admin-login-logo" src="/logo.png" alt="My Prospect">

      <p class="admin-login-intro">Accès réservé administrateur</p>

      <input id="adminEmail" class="admin-login-input" type="email" placeholder="Email admin">
      <input id="adminPassword" class="admin-login-input" type="password" placeholder="Mot de passe">

      <button class="admin-login-submit" onclick="adminLogin()">Se connecter</button>
    </section>
  </main>

  <script src="/js/pages/admin-login.js"></script>
</body>
</html>
